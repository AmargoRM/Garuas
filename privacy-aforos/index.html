<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Política de Privacidad – Garúa Aforos</title>
  <style>
    :root {
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6c7b;
      --brand: #163d60;
      --brand-soft: #e8eef5;
      --border: #d8e0ea;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .container {
      width: min(1080px, 92vw);
      margin: 0 auto;
      padding: 2.25rem 0 2.5rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.4vw, 1.9rem);
      font-weight: 650;
      letter-spacing: 0.01em;
      color: var(--brand);
    }

    .download {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--brand);
      text-decoration: none;
      padding: 0.56rem 0.85rem;
      border-radius: 0.65rem;
      font-size: 0.93rem;
      font-weight: 560;
      transition: all .2s ease;
    }

    .download:hover,
    .download:focus-visible {
      border-color: #b7c7d8;
      background: var(--brand-soft);
      outline: none;
    }

    .subtitle {
      margin: 0 0 1rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .viewer-shell {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.95rem;
      overflow: hidden;
      box-shadow: 0 10px 32px rgba(18, 43, 66, 0.08);
    }

    iframe {
      width: 100%;
      border: 0;
      height: 78vh;
      min-height: 520px;
      background: #f0f4f9;
    }

    .fallback {
      padding: 1rem;
      font-size: 0.95rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: #fbfdff;
    }

    @media (max-width: 720px) {
      .container { padding-top: 1.3rem; }
      iframe {
        height: 72vh;
        min-height: 440px;
      }
    }
  </style>
</head>
<body>
  <main class="container" aria-label="Política de Privacidad Garúa Aforos">
    <div class="header">
      <h1>Política de Privacidad – Garúa Aforos</h1>
      <a class="download" href="./politica-privacidad-garua-aforos.pdf" download>
        Descargar PDF
      </a>
    </div>

    <p class="subtitle">Documento legal oficial para Google Play Console.</p>

    <section class="viewer-shell" aria-label="Visor de política de privacidad">
      <iframe
        title="Política de Privacidad – Garúa Aforos"
        src="./politica-privacidad-garua-aforos.pdf#view=FitH"
        loading="lazy">
      </iframe>
      <div class="fallback">
        Si tu navegador no muestra el visor PDF, puedes descargar el archivo con el botón superior.
      </div>
    </section>
  </main>
</body>
</html>
